name: Build Mesa AAR Native

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Compilers and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build python3-pip python3-setuptools python3-mako libxrandr-dev libxxf86vm-dev libxcb-glx0-dev gettext bzip2 bison flex pkg-config zip unzip

      - name: Grant Execute Permissions to Gradle
        run: |
          chmod +x gradlew || true

      - name: Run Build Sequence via Gradle
        run: |
          NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -n 1)
          echo "Using Android NDK at: $NDK_PATH"
          
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_NDK_HOME=$NDK_PATH
          
          if [ -f "./gradlew" ]; then
            echo "Building AAR using local Gradle Wrapper..."
            ./gradlew assembleRelease
          else
            echo "Gradle wrapper not found, compiling using local gradle system..."
            gradle assembleRelease
          fi

      - name: Upload Compiled Mesa AAR
        uses: actions/upload-artifact@v4
        with:
          name: mesa-aar
          path: |
            **/build/outputs/aar/*.aar
          if-no-files-found: error
          
