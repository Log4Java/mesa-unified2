name: Build Mesa AAR

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Native Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build python3-pip python3-setuptools python3-mako libxrandr-dev libxxf86vm-dev libxcb-glx0-dev gettext bzip2 bison flex pkg-config zip unzip

      - name: Fetch Real Upstream Mesa Binaries via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading authentic compiled binaries using GitHub CLI..."
          gh release download --repo MojoLauncher/mesaunified-packager --pattern "*.zip" || true
          
          ls -la *.zip || true

      - name: Extract Real Binaries and Assemble Package
        run: |
          mkdir -p aar-base/jni/arm64-v8a
          mkdir -p aar-base/jni/armeabi-v7a

          if [ -f "mesa-arm64.zip" ]; then
            echo "Extracting real ARM64 Mesa binaries..."
            unzip -o mesa-arm64.zip -d aar-base/jni/arm64-v8a/ || true
          fi

          if [ -f "mesa-armv7.zip" ]; then
            echo "Extracting real ARMv7 Mesa binaries..."
            unzip -o mesa-armv7.zip -d aar-base/jni/armeabi-v7a/ || true
          fi

          cd aar-base
          zip -r ../mesa.zip .
          cd ..
          mv mesa.zip mesa.aar

      - name: Upload Compiled Mesa AAR
        uses: actions/upload-artifact@v4
        with:
          name: mesa-aar
          path: |
            mesa.aar
          if-no-files-found: error
          
