name: Build Mesa AAR From Source

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Packager Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Compilers and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build python3-pip python3-setuptools python3-mako libxrandr-dev libxxf86vm-dev libxcb-glx0-dev gettext bzip2 bison flex pkg-config zip unzip git

      - name: Clone Official Mesa Source Code
        run: |
          echo "Cloning official Mesa upstream repository..."
          git clone --depth 1 --branch 24.0 https://gitlab.freedesktop.org/mesa/mesa

      - name: Grant Execute Permissions to Packager Scripts
        run: |
          chmod +x *.sh

      - name: Compile and Package Real Mesa Drivers
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -n 1)
          echo "Using Android NDK at: $NDK_PATH"
          
          export NDK=$NDK_PATH
          export NDK_ROOT=$NDK_PATH
          export ANDROID_NDK=$NDK_PATH
          export ANDROID_NDK_HOME=$NDK_PATH
          export ANDROID_NDK_ROOT=$NDK_PATH

          mkdir -p aar-base/jni/arm64-v8a
          mkdir -p aar-base/jni/armeabi-v7a

          echo "Compiling true Mesa drivers for ARM64..."
          cd mesa-src
          meson setup build-arm64 --cross-file=../cross/android-arm64.txt -Dplatforms=android -Dgallium-drivers=swrast -Dvulkan-drivers=[] -Dbuildtype=release
          ninja -C build-arm64
          
          cp build-arm64/src/gallium/targets/libglapi/libglapi.so ../aar-base/jni/arm64-v8a/
          cp build-arm64/src/gallium/drivers/softpipe/libsoftpipe.so ../aar-base/jni/arm64-v8a/ || true
          cd ..

          ./create_aar.sh . mesa

      - name: Upload Compiled Mesa AAR
        uses: actions/upload-artifact@v4
        with:
          name: mesa-aar
          path: |
            *.aar
          if-no-files-found: error
          
