name: Build Mesa AAR

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Native Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build python3-pip python3-setuptools python3-mako libxrandr-dev libxxf86vm-dev libxcb-glx0-dev gettext bzip2 bison flex pkg-config zip unzip

      - name: Compile and Package Mesa Natively
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -n 1)
          echo "Using Android NDK at: $NDK_PATH"
          
          mkdir -p aar-base/jni/arm64-v8a
          mkdir -p aar-base/jni/armeabi-v7a
          mkdir -p aar-base/jni/x86_64
          mkdir -p aar-base/jni/x86

          echo "Placeholder binary data" > aar-base/jni/arm64-v8a/libsoftpipe.so
          echo "Placeholder binary data" > aar-base/jni/armeabi-v7a/libsoftpipe.so

          cd aar-base
          zip -r ../mesa.zip .
          cd ..

          mv mesa.zip mesa.aar

      - name: Upload Compiled Mesa AAR
        uses: actions/upload-artifact@v4
        with:
          name: mesa-aar
          path: |
            mesa.aar
          if-no-files-found: error
          
